databases:
  - name: hospitalguard-db
    plan: free
    databaseName: hospitalguard

services:
  # ---- FastAPI backend ----
  - type: web
    name: hospitalguard-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL
        fromDatabase:
          name: hospitalguard-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: https://hospitalguard-web.onrender.com

  # ---- React frontend (static site) ----
  - type: web
    name: hospitalguard-web
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_URL
        value: https://hospitalguard-api.onrender.com/api
